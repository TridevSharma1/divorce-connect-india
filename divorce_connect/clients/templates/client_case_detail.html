{% extends 'base.html' %}

{% block title %}Case Details – DivorceConnect{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/phase6.css">
{% endblock %}

{% block content %}
<div class="phase6-card" id="case-container" style="display:none;">
    <h2 class="case-title">Case #<span id="case-id"></span></h2>
    <div class="case-info">
        <p><strong>Lawyer:</strong> <span id="lawyer-name"></span></p>
        <p><strong>Status:</strong> <span id="case-status"></span></p>
        <p><strong>Created:</strong> <span id="case-created"></span></p>
        <p><strong>Workflow Stage:</strong> <span id="case-stage"></span></p>
    </div>
    <!-- Workflow progress bar -->
    <div class="workflow-bar" style="display:flex;gap:4px;margin-top:1rem;align-items:center">
        <div id="stage-pending" class="stage active" style="flex:1;padding:0.5rem;background:#e0e0e0;text-align:center;border-radius:4px">Pending</div>
        <div id="stage-docs" class="stage" style="flex:1;padding:0.5rem;background:#c0c0c0;text-align:center;border-radius:4px">Documents Uploaded</div>
        <div id="stage-verified" class="stage" style="flex:1;padding:0.5rem;background:#a0a0a0;text-align:center;border-radius:4px">Verified</div>
    </div>
    <hr>
    <h3>Documents</h3>
    <ul id="document-list"></ul>
    <button class="btn btn-primary" id="upload-btn">Upload Document</button>
    <input type="file" id="file-input" style="display:none;" />
</div>
<div id="toast"></div>

<script>
    const toast = document.getElementById('toast');
    function showToast(message, type='info') {
        toast.textContent = message;
        toast.style.display = 'block';
        toast.style.background = type==='success' ? 'var(--success)' : (type==='danger' ? 'var(--danger)' : 'var(--bg-card)');
        setTimeout(()=>{ toast.style.display='none'; }, 3000);
    }
    function getCaseId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }
    async function loadCase() {
        const caseId = getCaseId();
        if (!caseId) { showToast('Case ID missing', 'danger'); return; }
        try {
            const res = await fetch(`/api/client/cases/${caseId}`);
            if (!res.ok) throw new Error('Failed to fetch');
            const data = await res.json();
            document.getElementById('case-id').textContent = data.id;
            document.getElementById('lawyer-name').textContent = data.lawyer_id; // replace with more friendly name in real app
            document.getElementById('case-status').textContent = data.status;
            document.getElementById('case-created').textContent = new Date(data.created_at).toLocaleString();
            document.getElementById('case-stage').textContent = data.workflow_stage;
            const list = document.getElementById('document-list');
            list.innerHTML = '';
            data.documents.forEach(doc => {
                const li = document.createElement('li');
                // Inline preview for images, PDFs, and office docs
                const ext = doc.document_file.split('.').pop().toLowerCase();
                if (['png','jpg','jpeg','gif'].includes(ext)) {
                    const img = document.createElement('img');
                    img.src = `/static/uploads/${doc.document_file}`;
                    img.alt = doc.document_type;
                    img.style.maxWidth = '200px';
                    img.style.display = 'block';
                    li.appendChild(img);
                } else if (ext === 'pdf') {
                    const iframe = document.createElement('iframe');
                    iframe.src = `/static/uploads/${doc.document_file}`;
                    iframe.width = '200';
                    iframe.height = '250';
                    iframe.style.border = 'none';
                    li.appendChild(iframe);
                } else if (['doc','docx','ppt','pptx','xls','xlsx','txt'].includes(ext)) {
                    const iframe = document.createElement('iframe');
                    const fileUrl = encodeURIComponent(`${window.location.origin}/static/uploads/${doc.document_file}`);
                    iframe.src = `https://docs.google.com/gview?url=${fileUrl}&embedded=true`;
                    iframe.width = '200';
                    iframe.height = '250';
                    iframe.style.border = 'none';
                    li.appendChild(iframe);
                }
                const a = document.createElement('a');
                a.href = `/static/uploads/${doc.document_file}`;
                a.textContent = `${doc.document_type} (${doc.uploaded_at})`;
                a.target = '_blank';
                li.appendChild(a);
                list.appendChild(li);
            });
            document.getElementById('case-container').style.display = 'block';
                // Update workflow bar visual based on stage
                const stage = data.workflow_stage.toLowerCase();
                document.getElementById('stage-pending').classList.remove('active');
                document.getElementById('stage-docs').classList.remove('active');
                document.getElementById('stage-verified').classList.remove('active');
                if (stage === 'pending') {
                    document.getElementById('stage-pending').classList.add('active');
                } else if (stage === 'documents_uploaded') {
                    document.getElementById('stage-docs').classList.add('active');
                } else if (stage === 'verified') {
                    document.getElementById('stage-verified').classList.add('active');
                }
        } catch (e) {
            showToast(e.message, 'danger');
        }
    }
    document.getElementById('upload-btn').addEventListener('click',()=>{
        document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', async (e)=>{
        const file = e.target.files[0];
        if (!file) return;
        const caseId = getCaseId();
        const form = new FormData();
        form.append('file', file);
        try {
            const res = await fetch(`/api/client/cases/${caseId}/documents`, {
                method: 'POST',
                body: form
            });
            if (!res.ok) throw new Error('Upload failed');
            showToast('Document uploaded', 'success');
            loadCase(); // refresh list
        } catch (err) {
            showToast(err.message, 'danger');
        }
    });
    loadCase();
</script>
{% endblock %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DivorceConnect India</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center py-8 px-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <a href="/" class="flex justify-center">
                <img src="{{ url_for('static', path='Assets/LOGO.png') }}" alt="DivorceConnect" class="h-16 w-auto">
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mt-4">Forgot your password?</h1>
            <p class="text-sm text-gray-600 mt-2">Enter your email address and we will send you a verification code.</p>
        </div>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="fastapi_mock_csrf">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-900 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 text-sm">
            </div>
            <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded-lg font-semibold text-base">Send Verification Code</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Remembered your password?
            <a href="/login/" class="text-blue-600 hover:text-blue-800 font-semibold transition">Back to Sign In</a>
        </p>
    </div>
</body>
</html>

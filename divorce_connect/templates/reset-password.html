{% extends 'base.html' %}
{% block title %}Reset Password - DivorceConnect India{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 bg-gradient-to-br from-indigo-50 to-purple-100 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-10 left-10 w-64 h-64 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-blob"></div>
    <div class="absolute bottom-10 right-10 w-64 h-64 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-blob animation-delay-2000"></div>

    <div class="max-w-md w-full space-y-8 bg-white/50 backdrop-blur-lg rounded-2xl p-8 shadow-xl border border-white/60 relative z-10 transition-transform duration-500 hover:scale-[1.01]">
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 serif-heading">
                Enter OTP
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Please enter the OTP sent to your email and your new password.
            </p>
        </div>
        <form class="mt-8 space-y-6" id="resetPasswordForm">
            <input type="hidden" id="email-address" name="email">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="otp" class="sr-only">OTP</label>
                    <input id="otp" name="otp" type="text" required class="appearance-none rounded-t-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm bg-white/60 backdrop-blur-sm transition-all" placeholder="6-digit OTP">
                </div>
                <div>
                    <label for="new-password" class="sr-only">New Password</label>
                    <input id="new-password" name="new-password" type="password" required class="appearance-none rounded-b-md relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm bg-white/60 backdrop-blur-sm transition-all" placeholder="New Password">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Reset Password
                </button>
            </div>
            
            <div class="text-sm text-center">
                <a href="/login" class="font-medium text-black hover:text-gray-800 transition-colors">
                    Back to login
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
</style>

<script src="/static/js/auth_actions.js"></script>
<script>
// Get email from URL params
const urlParams = new URLSearchParams(window.location.search);
const email = urlParams.get('email');
if(email) {
    document.getElementById('email-address').value = email;
}

document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const emailVal = document.getElementById('email-address').value;
    const otp = document.getElementById('otp').value;
    const newPassword = document.getElementById('new-password').value;
    
    if(!emailVal) {
        alert("Email is missing. Please go back to forgot password step.");
        return;
    }
    await resetPassword(emailVal, otp, newPassword);
});
</script>
{% endblock %}

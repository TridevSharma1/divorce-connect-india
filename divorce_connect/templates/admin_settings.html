{% extends 'base.html' %}
{% block title %}Admin Settings - DivorceConnect India{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col md:flex-row relative overflow-hidden">
    {% include 'includes/navbar_admin.html' %}

    <!-- Background styling -->
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 to-purple-50 z-0 pointer-events-none"></div>
    
    <main class="flex-1 p-6 lg:p-12 relative z-10 overflow-y-auto">
        <div class="max-w-3xl mx-auto space-y-8">
            
            <header class="mb-8">
                <h1 class="text-4xl font-extrabold text-gray-900 serif-heading tracking-tight">Admin Profile Settings</h1>
                <p class="mt-2 text-gray-600">Update your profile details. Changes require superuser approval before going live.</p>
            </header>

            <div class="bg-white/60 backdrop-blur-xl rounded-3xl p-8 shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white/70">
                <form id="editAdminProfileForm" class="space-y-6">
                    <div class="grid grid-cols-1 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" id="full_name" class="mt-1 p-3 w-full border border-gray-300 rounded-xl focus:ring-black focus:border-black bg-white/50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Phone</label>
                            <input type="text" id="phone" class="mt-1 p-3 w-full border border-gray-300 rounded-xl focus:ring-black focus:border-black bg-white/50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Department</label>
                            <input type="text" id="department" class="mt-1 p-3 w-full border border-gray-300 rounded-xl focus:ring-black focus:border-black bg-white/50">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-200">
                        <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-black text-white rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-1 transform transition-all font-medium">
                            Submit Edit Request
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>
</div>

<script>
document.getElementById("editAdminProfileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = localStorage.getItem("jwt_token");
    
    // Construct the data to edit
    const requested_data = {};
    const fields = ['full_name', 'phone', 'department'];
    fields.forEach(f => {
        const val = document.getElementById(f).value;
        if(val) requested_data[f] = val;
    });

    try {
        const res = await fetch("/api/profiles/edit-request", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ requested_data })
        });
        const data = await res.json();
        if(res.ok) {
            alert(data.message);
        } else {
            alert(data.detail || "Failed to submit request");
        }
    } catch(e) {
        console.error(e);
    }
});
</script>
{% endblock %}

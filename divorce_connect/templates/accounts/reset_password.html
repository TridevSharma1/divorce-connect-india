{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DivorceConnect India</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center py-8 px-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <a href="/" class="flex justify-center">
                <img src="{% static 'Assets/LOGO.png' %}" alt="DivorceConnect" class="h-16 w-auto">
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mt-4">Create a new password</h1>
            <p class="text-sm text-gray-600 mt-2">Choose a strong password for your account.</p>
        </div>

        <div id="error-message" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-50 border border-red-200 text-red-700"></div>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="fastapi_mock_csrf">
            <input type="hidden" name="email" value="{{ email }}">
            <div>
                <label for="new_password" class="block text-sm font-semibold text-gray-900 mb-1">New Password</label>
                <input type="password" id="new_password" name="new_password" required placeholder="Enter new password" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 text-sm">
                <p class="mt-1 text-xs text-gray-500">At least 10 characters with uppercase, lowercase, number, and special character</p>
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-semibold text-gray-900 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 text-sm">
            </div>
            <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded-lg font-semibold text-base">Save New Password</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.classList.add('hidden');
            
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&_#^()\-+={}\[\]|\\:;\"'<>,.?/~`])[A-Za-z\d@$!%*?&_#^()\-+={}\[\]|\\:;\"'<>,.?/~`]{10,}$/;
            if (!passwordRegex.test(password)) {
                e.preventDefault();
                errorDiv.textContent = 'Password must be at least 10 characters long, and contain at least one uppercase letter, one lowercase letter, one number, and one special character.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            if (password !== confirmPassword) {
                e.preventDefault();
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.classList.remove('hidden');
                return;
            }
        });
    </script>
</body>
</html>

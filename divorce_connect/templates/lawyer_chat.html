{% extends 'base.html' %}
{% block title %}Client Chat - DivorceConnect India{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col relative overflow-hidden h-screen">
    {% include 'includes/navbar_lawyer.html' %}
    
    <!-- Background styling -->
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 to-blue-50 z-0 pointer-events-none"></div>
    <div class="absolute top-20 -right-20 w-[600px] h-[600px] bg-indigo-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-40"></div>

    <main class="flex-1 flex flex-col p-4 lg:p-8 relative z-10 overflow-hidden">
        <div class="max-w-5xl mx-auto w-full h-full flex flex-col bg-white/60 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/80 overflow-hidden">
            
            <!-- Chat Header -->
            <header class="bg-white/40 border-b border-white/60 p-6 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 serif-heading">Client Consultation</h2>
                    <p class="text-sm text-gray-500 mt-1" id="chat-subtitle">Connecting to secure chat...</p>
                </div>
                <a href="/lawyer_dashboard" class="px-4 py-2 bg-white rounded-xl shadow-sm border border-gray-200 text-sm font-medium hover:bg-gray-50 transition-colors">
                    Back to Dashboard
                </a>
            </header>

            <!-- Chat Messages Area -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages will be injected here by chat.js -->
            </div>

            <!-- Chat Input Area -->
            <div class="bg-white/60 border-t border-white/60 p-4 sm:p-6">
                <form id="chat-form" class="flex space-x-4">
                    <input type="text" id="chat-input" required class="flex-1 rounded-2xl border-gray-300 shadow-sm focus:border-black focus:ring-black bg-white/80 px-4 py-3" placeholder="Type your message...">
                    <button type="button" class="p-3 text-gray-500 hover:text-black bg-white rounded-2xl shadow-sm border border-gray-200 transition-colors" title="Attach Document" onclick="alert('Document attachment would trigger Cloudinary upload here')">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    </button>
                    <button type="submit" class="px-8 py-3 bg-black text-white rounded-2xl shadow-lg hover:bg-gray-800 transition-colors font-medium flex items-center space-x-2">
                        <span>Send</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/chat.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const token = localStorage.getItem("jwt_token");
    if(!token) window.location.href = "/login";
    
    const urlParams = new URLSearchParams(window.location.search);
    const caseId = urlParams.get('case_id');
    
    if(!caseId) {
        alert("No case selected");
        window.location.href = "/lawyer_dashboard";
        return;
    }

    // Get current user ID
    try {
        const res = await fetch("/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const user = await res.json();
        
        document.getElementById('chat-subtitle').textContent = `Case #${caseId} • Connected securely`;
        
        // Initialize WebSocket
        initializeChat(parseInt(caseId), user.id);
        
    } catch(e) {
        console.error("Auth error", e);
    }
});

document.getElementById('chat-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const msg = input.value;
    if(msg.trim()) {
        sendChatMessage(msg);
        input.value = "";
    }
});
</script>
{% endblock %}

    <!-- Notification Bell -->

    <div class="relative" id="notificationContainer">
  <!-- Bell Icon Trigger Button -->
  <button
    id="notificationBell"
    class="relative p-2 text-gray-900 hover:bg-gray-50 rounded-lg transition-colors duration-200"
    aria-label="Notifications"
    aria-expanded="false"
    aria-haspopup="true"
  >
    <!-- Bell SVG -->
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>

    <!-- Pulsing Red Unread Indicator Dot with Number -->
    <span
      id="notificationDot"
      class="pulse-dot hidden" style="color: #ffffff !important; display: none !important; align-items: center !important; justify-content: center !important; font-size: 9px !important; line-height: 1 !important; font-weight: bold !important; width: 15px !important; height: 15px !important; background-color: #ef4444 !important; border-radius: 9999px !important; position: absolute !important; top: -2px !important; right: -2px !important; z-index: 10 !important;"
    >
      0
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div
    id="notificationPanel"
    class="hidden absolute right-0 mt-2 w-96 bg-white rounded-xl shadow-xl border border-gray-100 z-50 overflow-hidden"
    style="font-family: 'Inter', sans-serif;"
  >
    <!-- Header -->
    <div class="px-4 py-3 border-b border-gray-100 bg-white flex items-center justify-between">
      <h3 class="text-sm font-bold text-gray-900">Notifications</h3>
      <button
        id="markAllRead"
        class="text-xs text-gray-500 hover:text-gray-900 transition-colors duration-150 font-medium"
        aria-label="Mark all notifications as read"
      >
        Mark all as read
      </button>
    </div>

    <!-- Notifications List -->
    <div class="max-h-96 overflow-y-auto" id="notificationsList">
      <!-- Notifications will load here via JS -->
    </div>

    <!-- Footer -->
    <div class="px-4 py-3 bg-white border-t border-gray-100 text-center">
      <a
        href="/lawyer_dashboard/"
        class="text-sm font-medium text-gray-900 hover:text-gray-600 transition-colors duration-150"
        aria-label="View all notifications"
      >
        View all notifications
      </a>
    </div>
  </div>
</div>

    <!-- Profile Dropdown -->

        <button onclick="toggleDropdown('lawyerDropdown')" class="flex items-center gap-2">

                </svg>

        </button>

        <div id="lawyerDropdown" class="dropdown-menu">
            <a href="/lawyer_dashboard/" class="dropdown-item">Dashboard</a>

            <a href="/logout/" class="dropdown-item logout-item">Logout</a>
        </div>
    </div>
</nav>

<!-- Vanilla JavaScript Toggle Logic for notification bell -->
<script>
  (function() {
    const notificationContainer = document.getElementById('notificationContainer');
    const notificationBell = document.getElementById('notificationBell');
    const notificationPanel = document.getElementById('notificationPanel');

    if (notificationBell && notificationPanel) {
      // Toggle dropdown on bell click
      notificationBell.addEventListener('click', function(event) {
        event.stopPropagation();
        notificationPanel.classList.toggle('hidden');
        notificationBell.setAttribute('aria-expanded', !notificationPanel.classList.contains('hidden'));
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        if (notificationContainer && !notificationContainer.contains(event.target)) {
          notificationPanel.classList.add('hidden');
          notificationBell.setAttribute('aria-expanded', 'false');
        }
      });

      // Close on Escape key
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && !notificationPanel.classList.contains('hidden')) {
          notificationPanel.classList.add('hidden');
          notificationBell.setAttribute('aria-expanded', 'false');
        }
      });
    }
  })();
</script>
